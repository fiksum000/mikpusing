name: PHP and shell syntax audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint all PHP files
        run: |
          set -o pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run pure PHP regression smoke tests
        run: php tests/smoke.php
      - name: Check Billing and RADIUS NAS inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('settings/billing-integrations.php', 'settings/radius-nas.php'):
              source = Path(name).read_text()
              if '<script>' not in source or '</script>' not in source:
                  raise SystemExit(f'{name}: inline script was not found')
              js_parts = re.findall(r'<script>(.*?)</script>', source, flags=re.S)
              for index, js in enumerate(js_parts):
                  # Replace server-side PHP expressions with valid JS literals for syntax-only checking.
                  js = re.sub(r'<\?=.*?\?>', '"placeholder"', js, flags=re.S)
                  if '<?' in js or '?>' in js:
                      raise SystemExit(f'{name}: unprocessed PHP expression remains in inline JavaScript')
                  out = Path(f'/tmp/{Path(name).stem}-{index}.js')
                  out.write_text(js)
          PY
          for f in /tmp/billing-integrations-*.js /tmp/radius-nas-*.js; do
            node --check "$f"
          done

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and backup shell scripts
        run: |
          set -euo pipefail
          for f in deploy/*.sh; do
            bash -n "$f"
            echo "OK: $f"
          done
