name: PHP and shell syntax audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint all PHP files
        run: |
          set -o pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run pure PHP regression smoke tests
        run: |
          php tests/smoke.php
          python3 tests/callback-http.py
          python3 tests/billing-concurrency.py
      - name: Check Billing and RADIUS NAS inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('settings/billing-integrations.php', 'settings/radius-nas.php'):
              source = Path(name).read_text()
              if '<script>' not in source or '</script>' not in source:
                  raise SystemExit(f'{name}: inline script was not found')
              js_parts = re.findall(r'<script>(.*?)</script>', source, flags=re.S)
              for index, js in enumerate(js_parts):
                  # Replace server-side PHP expressions with valid JS literals for syntax-only checking.
                  js = re.sub(r'<\?=.*?\?>', '"placeholder"', js, flags=re.S)
                  if '<?' in js or '?>' in js:
                      raise SystemExit(f'{name}: unprocessed PHP expression remains in inline JavaScript')
                  out = Path(f'/tmp/{Path(name).stem}-{index}.js')
                  out.write_text(js)
          PY
          for f in /tmp/billing-integrations-*.js /tmp/radius-nas-*.js; do
            node --check "$f"
          done

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and backup shell scripts
        run: |
          set -euo pipefail
          for f in deploy/*.sh; do
            bash -n "$f"
            echo "OK: $f"
          done

  ubuntu-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install complete stack on disposable Ubuntu VM
        run: |
          sudo mkdir -p /var/www/mikhmon
          sudo rsync -a --exclude=.git ./ /var/www/mikhmon/
          sudo env APP_DIR=/var/www/mikhmon RADIUS_SERVER_IP=192.0.2.10 RADIUS_NAS_IP=192.0.2.2 bash /var/www/mikhmon/deploy/install-full-radius.sh
      - name: Database integration and repeat installation
        run: |
          cd /var/www/mikhmon
          sudo env MIKPUSING_TEST_DATABASE=1 php tests/radius-integration.php
          sudo python3 tests/web-install.py
          sudo sha256sum /etc/mikhmon/radius.php > /tmp/radius-before.sha
          sudo env APP_DIR=/var/www/mikhmon bash deploy/install-full-radius.sh
          sudo sha256sum --check /tmp/radius-before.sha
          backup=$(sudo find /var/backups/mikpusing -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          sudo bash deploy/restore-full-radius.sh "$backup" --confirm-restore
          sudo systemctl restart apache2 mariadb freeradius cron
          sudo bash deploy/preflight.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo systemctl --no-pager status apache2 mariadb freeradius cron || true
          sudo journalctl -u apache2 -u freeradius -n 60 --no-pager || true
